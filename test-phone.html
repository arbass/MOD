<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Phone Input Test</title>
  <link rel="stylesheet" href="./dist/index.css">
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      max-width: 600px;
      margin: 50px auto;
      padding: 20px;
      background: #f5f5f5;
    }
    
    h1 {
      color: #333;
      margin-bottom: 30px;
    }
    
    form {
      background: white;
      padding: 30px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
    }
    
    label {
      display: block;
      margin-bottom: 8px;
      font-weight: 600;
      color: #555;
    }
    
    .text-field-input {
      width: 100%;
      padding: 12px;
      font-size: 16px;
      border: 1px solid #ddd;
      border-radius: 6px;
      box-sizing: border-box;
      transition: border-color 0.2s ease;
    }
    
    .text-field-input:focus {
      outline: none;
      border-color: #007bff;
    }
    
    .text-field-input.error {
      border-color: #dc3545;
    }
    
    .text-field-input.valid {
      border-color: #28a745;
    }
    
    button {
      margin-top: 20px;
      padding: 12px 30px;
      background: #007bff;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 16px;
      font-weight: 600;
      transition: background 0.2s ease;
    }
    
    button:hover {
      background: #0056b3;
    }
    
    .info {
      margin-top: 30px;
      padding: 20px;
      background: white;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
    }
    
    .info h3 {
      margin-top: 0;
      color: #333;
    }
    
    .info ul {
      line-height: 1.8;
      color: #666;
    }
  </style>
</head>
<body>
  <h1>Phone Country Selector Test</h1>
  
  <form>
    <label for="phone">Phone Number:</label>
    <input 
      class="text-field-input w-input" 
      maxlength="256" 
      name="phone" 
      data-name="phone" 
      placeholder="Enter your phone number" 
      type="tel" 
      id="phone" 
      required
    />
    
    <button type="submit">Submit</button>
  </form>
  
  <div class="info">
    <h3>Features:</h3>
    <ul>
      <li>Click on the flag/country code to select a different country</li>
      <li>Type to search for countries</li>
      <li>Automatic formatting as you type</li>
      <li>Validation on blur (green = valid, red = invalid)</li>
      <li>Preferred countries (UA, US, GB, DE) shown at top</li>
    </ul>
  </div>
  
  <script src="https://d3e54v103j8qbb.cloudfront.net/js/jquery-3.5.1.min.dc5e7f18c8.js?site=XXX"></script>
  <script src="./dist/index.js"></script>
</body>
</html>
